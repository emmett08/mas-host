[package]
name = "mas-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native application host for the MAS protocol"

[dependencies]
mas-host-core.workspace = true
mas-host-native-build.workspace = true
mas-host-runtime.workspace = true
mas-host-providers.workspace = true
mas-host-process.workspace = true
mas-host-schema.workspace = true
mas-host-workflow.workspace = true
mas-host-worker.workspace = true
mas-host-privacy.workspace = true
mas-protocol-codec.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
rusqlite.workspace = true
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "time", "sync"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }
num-bigint = "=0.4.8"

postgres = { version = "=0.19.12", optional = true }

[features]
shared-native = ["mas-host-core/shared-native", "dep:postgres"]

[dev-dependencies]
rusqlite.workspace = true
