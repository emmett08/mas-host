name: Native host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Cursor adapter contract without credentials
        run: node --test assets/providers/cursor.test.mjs
      - name: Check Python runtime for SDK and generated workers
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - name: Format, analyse and test
        run: make test
      - name: Native applications and effect recovery
        run: make acceptance
