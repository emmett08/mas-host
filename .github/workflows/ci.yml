name: Native host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Cursor adapter contract without credentials
        run: node --test assets/providers/cursor.test.mjs
      - name: Check Python runtime for SDK and generated workers
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - name: Format, analyse and test
        run: make test
      - name: Native applications and effect recovery
        run: make acceptance
      - name: Check host control and governed recovery with SPIN
        run: |
          sudo apt-get update
          sudo apt-get install -y spin
          python3 formal/verify.py
      - name: Retain formal verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-revision-verification
          path: formal/evidence
          if-no-files-found: warn
          retention-days: 14

  shared-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: native-fixture-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MAS_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=native-fixture-password dbname=postgres sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Analyse optional shared profile
        run: cargo clippy --locked -p mas-host --features shared-native --all-targets -- -D warnings
      - name: Check shared preflight, deadline translation and queue decisions
        run: |
          cargo test --locked -p mas-host-core --features shared-native shared_native::tests
          cargo test --locked -p mas-host --features shared-native --bin mas-host shared_queue::tests
      - name: Exercise native PostgreSQL execution and paged queue traversal
        run: cargo test --locked -p mas-host --features shared-native --test shared_native --test shared_queue -- --ignored --nocapture
