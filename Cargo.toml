[workspace]
resolver = "2"
members = ["crates/*", "sdk/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/emmett08/mas-host"

[workspace.dependencies]
mas-protocol-codec = { git = "https://github.com/emmett08/mas", rev = "e1257fb7125cdc971d94e38221c5185818bb577d" }
serde_json = { version = "=1.0.152", features = ["arbitrary_precision"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.11.0"
libc = "=0.2.190"
mas-host-worker = { path = "crates/mas-host-worker" }
mas-host-core = { path = "crates/mas-host-core" }
mas-host-native-build = { path = "crates/mas-host-native-build" }
mas-host-runtime = { path = "crates/mas-host-runtime" }
mas-host-providers = { path = "crates/mas-host-providers" }
mas-host-workflow = { path = "crates/mas-host-workflow" }
mas-host-process = { path = "crates/mas-host-process" }
mas-host-schema = { path = "crates/mas-host-schema" }
mas-host-privacy = { path = "crates/mas-host-privacy" }
